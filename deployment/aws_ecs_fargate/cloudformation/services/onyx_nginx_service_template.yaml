AWSTemplateFormatVersion: "2010-09-09"
Description: "The template used to create an ECS Service from the ECS Console."

Parameters:
  PublicSubnetIDs:
    Type: CommaDelimitedList
    Description: >
      Comma-delimited list of public subnet IDs (at least 2 in different AZs) used
      by the Application Load Balancer. These subnets must have internet-gateway
      routes. ECS tasks do NOT run here.
  PrivateSubnetIDs:
    Type: CommaDelimitedList
    Description: >
      Comma-delimited list of private subnet IDs where the nginx ECS task runs.
      Must have outbound internet access via a NAT Gateway.
  VpcID:
    Type: String
    Default: vpc-098cfa79d637dabff
  HostedZoneId:
    Type: String
    Default: ''
  DomainName:
    Type: String
    Default: demo.danswer.ai
  Environment:
    Type: String
  ServiceName:
    Type: String
    Default: onyx-nginx
  OnyxNamespace:
    Type: String
    Default: onyx
  OnyxBackendApiServiceName:
    Type: String
    Default: onyx-backend-api-server-service
  OnyxWebServerServiceName:
    Type: String
    Default: onyx-web-server-service
  TaskCpu:
    Type: String
    Default: "512"
  TaskMemory:
    Type: String
    Default: "1024"
  TaskDesiredCount:
    Type: Number
    Default: 1
  CertificateArn:
    Type: String
    Default: ''
    Description: >
      ARN of the ACM certificate to attach to the HTTPS listener. When set, the
      HTTP listener redirects to HTTPS and a port-443 listener is created.
      Populated automatically by deploy.sh from the ACM stack output when
      HostedZoneId is configured. Leave blank to run HTTP-only.
  S3Bucket:
    Type: String
    Description: >
      Name of the S3 bucket that holds the nginx configuration files.
      deploy.sh uploads app.conf.template and run-nginx.sh to the
      nginx/ prefix of this bucket before the nginx service stack deploys.
      The cluster stack creates this bucket as <Environment>-onyx-ecs-fargate-configs.

Conditions:
  CreateRoute53: !Not
    - !Equals
      - !Ref HostedZoneId
      - ''
  CreateHttpsListener: !Not
    - !Equals
      - !Ref CertificateArn
      - ''

Resources:
  ECSService:
    Type: "AWS::ECS::Service"
    DependsOn: LoadBalancerHttpListener
    Properties:
      Cluster:
        Fn::ImportValue:
          Fn::Sub: "${Environment}-onyx-cluster-ECSClusterName"
      CapacityProviderStrategy:
        - CapacityProvider: "FARGATE"
          Base: 0
          Weight: 1
      TaskDefinition: !Ref TaskDefinition
      ServiceName: !Sub ${Environment}-${ServiceName}
      SchedulingStrategy: "REPLICA"
      DesiredCount: !Ref TaskDesiredCount
      AvailabilityZoneRebalancing: "ENABLED"
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref NginxTaskSecurityGroup
            - Fn::ImportValue:
                Fn::Sub: "${Environment}-onyx-efs-ECSTasksSecurityGroup"
          Subnets: !Ref PrivateSubnetIDs
      PlatformVersion: "LATEST"
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      DeploymentController:
        Type: "ECS"
      ServiceConnectConfiguration:
        Enabled: false
      ServiceRegistries:
        - RegistryArn: !GetAtt
            - "ServiceDiscoveryService"
            - "Arn"
      Tags:
        - Key: app
          Value: onyx
        - Key: service
          Value: !Ref ServiceName
        - Key: env
          Value: !Ref Environment
      EnableECSManagedTags: true
      LoadBalancers:
        - ContainerName: nginx
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Environment}-${ServiceName}-TaskDefinition
      ContainerDefinitions:
        - Name: nginx
          Image: nginx:1.25.5-alpine
          Cpu: 0
          PortMappings:
            - Name: nginx-80-tcp
              ContainerPort: 80
              HostPort: 80
              Protocol: tcp
          Essential: true
          Command:
            - /bin/sh
            - -c
            - dos2unix /etc/nginx/conf.d/run-nginx.sh && /etc/nginx/conf.d/run-nginx.sh app.conf.template
          Environment:
            - Name: EMAIL
              Value: ""
            - Name: DOMAIN
              Value: !Ref DomainName
            - Name: ONYX_BACKEND_API_HOST
              Value: !Sub ${Environment}-${OnyxBackendApiServiceName}.${OnyxNamespace}
            - Name: ONYX_WEB_SERVER_HOST
              Value: !Sub ${Environment}-${OnyxWebServerServiceName}.${OnyxNamespace}
          MountPoints:
            - SourceVolume: efs-volume
              ContainerPath: /etc/nginx/conf.d
          VolumesFrom: []
          DependsOn:
            - ContainerName: s3-sync-container
              Condition: SUCCESS
          HealthCheck:
            Command:
              - CMD-SHELL
              - "wget -qO- http://localhost/api/health || exit 1"
            Interval: 15
            Timeout: 10
            Retries: 5
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/${Environment}-OnyxNginxTaskDefinition
              mode: non-blocking
              awslogs-create-group: "true"
              max-buffer-size: 25m
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          SystemControls: []
        # Init container: copies nginx config files from S3 to the shared EFS
        # volume before the nginx container starts. Uses the task's IAM role
        # (ECSTaskRole) which has s3:GetObject on the config bucket.
        - Name: s3-sync-container
          Image: amazon/aws-cli:latest
          Cpu: 128
          MemoryReservation: 256
          PortMappings: []
          Essential: false
          EntryPoint:
            - /bin/sh
            - -c
          Command:
            - !Sub >-
              aws s3 cp s3://${S3Bucket}/nginx/app.conf.template /etc/nginx/conf.d/app.conf.template
              && aws s3 cp s3://${S3Bucket}/nginx/run-nginx.sh /etc/nginx/conf.d/run-nginx.sh
              && chmod 644 /etc/nginx/conf.d/app.conf.template
              && chmod 755 /etc/nginx/conf.d/run-nginx.sh
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
          MountPoints:
            - SourceVolume: efs-volume
              ContainerPath: /etc/nginx/conf.d
          VolumesFrom: []
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/${Environment}-s3-sync-configs-TaskDefinition
              mode: non-blocking
              awslogs-create-group: "true"
              max-buffer-size: 25m
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          SystemControls: []
      TaskRoleArn:
        Fn::ImportValue:
          Fn::Sub: "${Environment}-onyx-cluster-ECSTaskRole"
      ExecutionRoleArn:
        Fn::ImportValue:
          Fn::Sub: "${Environment}-onyx-cluster-ECSTaskExecutionRole" 
      NetworkMode: awsvpc
      Volumes:
        - Name: efs-volume
          EFSVolumeConfiguration:
            FilesystemId:
              Fn::ImportValue:
                Fn::Sub: "${Environment}-onyx-efs-OnyxEfsId"
            RootDirectory: /
      PlacementConstraints: []
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      EnableFaultInjection: false 

  # Internet-facing security group attached to the Application Load Balancer.
  # Allows HTTP (80) and HTTPS (443) from anywhere. The HTTP listener redirects
  # to HTTPS when a certificate is configured; otherwise it forwards directly.
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Internet-facing security group for the ${ServiceName} ALB"
      GroupName: !Sub ${Environment}-alb-${ServiceName}
      VpcId: !Ref VpcID
      SecurityGroupIngress:
        - FromPort: 80
          ToPort: 80
          IpProtocol: tcp
          CidrIp: "0.0.0.0/0"
        - FromPort: 80
          ToPort: 80
          IpProtocol: tcp
          CidrIpv6: "::/0"
        - FromPort: 443
          ToPort: 443
          IpProtocol: tcp
          CidrIp: "0.0.0.0/0"
        - FromPort: 443
          ToPort: 443
          IpProtocol: tcp
          CidrIpv6: "::/0"

  # Security group attached to the nginx ECS task.
  # Allows inbound port 80 from the ALB only (ALB terminates TLS; the task
  # always receives plain HTTP even when HTTPS is enabled end-to-end).
  NginxTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Security group for the ${ServiceName} ECS task — ALB access only"
      GroupName: !Sub ${Environment}-ecs-${ServiceName}
      VpcId: !Ref VpcID
      SecurityGroupIngress:
        - FromPort: 80
          ToPort: 80
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  ServiceDiscoveryService:
    Type: "AWS::ServiceDiscovery::Service"
    Properties:
      Name: !Ref ServiceName
      DnsConfig:
        DnsRecords:
          - Type: "A"
            TTL: 15
      NamespaceId:
        Fn::ImportValue:
          Fn::Sub: "${Environment}-onyx-cluster-OnyxNamespace"
      HealthCheckCustomConfig:
        FailureThreshold: 1

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: ALBSecurityGroup
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIDs
      SecurityGroups:
        - !Ref ALBSecurityGroup

  # HTTP listener — redirects to HTTPS when a certificate is configured,
  # forwards directly to the target group when running HTTP-only.
  LoadBalancerHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - CreateHttpsListener
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  # HTTPS listener — only created when CertificateArn is provided.
  # Uses a modern TLS 1.2/1.3 security policy and terminates SSL at the ALB;
  # the nginx task always receives plain HTTP on port 80.
  LoadBalancerHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateHttpsListener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: True
      HealthCheckIntervalSeconds: 30
      HealthCheckPort: 80
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 20
      HealthyThresholdCount: 3
      Port: 80
      Protocol: HTTP
      ProtocolVersion: HTTP1
      VpcId: !Ref VpcID
      TargetType: ip

  Route53Record:
    Type: AWS::Route53::RecordSet
    Condition: CreateRoute53
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  ECSService:
    Description: "The created service."
    Value: !Ref "ECSService"
  ServiceDiscoveryService:
    Value: !Ref "ServiceDiscoveryService"
  OutputOnyxLoadBalancerDNSName:
    Description: ALB DNS name (use this for HTTP access or as the CNAME target)
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-OnyxLoadBalancerDNSName
  OutputOnyxHttpUrl:
    Description: HTTP endpoint (redirects to HTTPS when certificate is configured)
    Value: !Sub "http://${LoadBalancer.DNSName}"
  OutputOnyxHttpsUrl:
    Description: HTTPS endpoint (only available when CertificateArn is provided)
    Condition: CreateHttpsListener
    Value: !Sub "https://${DomainName}"
