Parameters:

  EFSName:
    Type: String
    Default: onyx-efs
  Environment:
    Type: String
    Default: production
  VpcID:
    Type: String
    Default: vpc-0f230ca52bb04c722
  PrivateSubnetIDs:
    Type: CommaDelimitedList
    Description: >
      Comma-delimited list of private subnet IDs where EFS mount targets will be
      created. These must be the same private subnets used by ECS Fargate tasks so
      that tasks can reach the mount targets over NFS (port 2049). Requires at least
      two subnets in different Availability Zones for high availability.

Resources:

  OnyxEfs:
    Type: AWS::EFS::FileSystem
    Properties:
      BackupPolicy: 
        Status: ENABLED
      Encrypted: True
      PerformanceMode: generalPurpose
      FileSystemTags:
        - Key: Name
          Value: !Sub ${Environment}-${EFSName}-${AWS::Region}-${AWS::AccountId}
      FileSystemProtection:
        ReplicationOverwriteProtection: ENABLED
      ThroughputMode: elastic

  VespaEngineTmpEfsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      AccessPointTags: 
        - Key: Name
          Value: vespaengine-tmp
      FileSystemId: !Ref OnyxEfs
      RootDirectory: 
        CreationInfo:
          OwnerGid: "1000"
          OwnerUid: "1000"
          Permissions: "0755"
        Path: /var/tmp

  VespaEngineDataEfsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      AccessPointTags: 
        - Key: Name
          Value: vespaengine-data
      FileSystemId: !Ref OnyxEfs
      RootDirectory: 
        CreationInfo:
          OwnerGid: "1000"
          OwnerUid: "1000"
          Permissions: "0755"
        Path: /opt/vespa/var

  PostgresDataEfsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      AccessPointTags: 
        - Key: Name
          Value: postgres-data
      FileSystemId: !Ref OnyxEfs
      RootDirectory: 
        CreationInfo:
          OwnerGid: "1000"
          OwnerUid: "1000"
          Permissions: "0755"
        Path: /var/lib/postgresql/data

  EFSMountTarget1:
    DependsOn: OnyxEfs
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref OnyxEfs
      SubnetId: !Select [0, !Ref PrivateSubnetIDs]
      SecurityGroups:
        - !Ref EFSSecurityGroupMountTargets

  EFSMountTarget2:
    DependsOn: OnyxEfs
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref OnyxEfs
      SubnetId: !Select [1, !Ref PrivateSubnetIDs]
      SecurityGroups:
        - !Ref EFSSecurityGroupMountTargets

  # Shared identity security group attached to every Onyx ECS Fargate task.
  # Contains no ingress rules of its own — it exists so that per-service security
  # groups can reference it as a source ("only allow traffic from Onyx tasks").
  # Exported so that the cluster template and all service templates can import it.
  ECSTasksSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Shared identity SG attached to every Onyx ECS Fargate task
      GroupName: !Sub ${Environment}-onyx-ecs-tasks
      VpcId: !Ref VpcID
      Tags:
        - Key: app
          Value: onyx
        - Key: env
          Value: !Ref Environment

  # NFS (port 2049) is restricted to traffic from Onyx ECS tasks only.
  # Only containers that have ECSTasksSecurityGroup attached can reach the mount targets.
  EFSSecurityGroupMountTargets:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for EFS Mount Targets
      VpcId: !Ref VpcID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ECSTasksSecurityGroup

Outputs:
  OutputECSTasksSecurityGroup:
    Description: Shared identity SG attached to every Onyx ECS task
    Value: !Ref ECSTasksSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-ECSTasksSecurityGroup
  OutputOnyxEfsId:
    Description: Onyx Filesystem Id
    Value: !Ref OnyxEfs
    Export:
      Name: !Sub ${AWS::StackName}-OnyxEfsId
  OutputVespaEngineTmpEfsAccessPoint:
    Description: VespaEngine Tmp AP
    Value: !Ref VespaEngineTmpEfsAccessPoint
    Export:
      Name: !Sub ${AWS::StackName}-VespaEngineTmpEfsAccessPoint
  OutputVespaEngineDataEfsAccessPoint:
    Description: VespaEngine Data Ap
    Value: !Ref VespaEngineDataEfsAccessPoint
    Export:
      Name: !Sub ${AWS::StackName}-VespaEngineDataEfsAccessPoint
  OutputPostgresDataEfsAccessPoint:
    Description: Postgres Data AP
    Value: !Ref PostgresDataEfsAccessPoint
    Export:
      Name: !Sub ${AWS::StackName}-PostgresDataEfsAccessPoint
  OutputEFSSecurityGroupMountTargets:
    Description: EFS Security Group
    Value: !Ref EFSSecurityGroupMountTargets
    Export:
      Name: !Sub ${AWS::StackName}-EFSSecurityGroupMountTargets
