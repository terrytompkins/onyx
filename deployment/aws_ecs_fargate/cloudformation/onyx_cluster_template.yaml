AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ECS cluster, Service Discovery namespace, S3 buckets (configs + file store), IAM roles, and Secrets Manager secrets
  for Postgres (POSTGRES_PASSWORD) and Onyx (USER_AUTH_SECRET). Deploy/update this stack before service stacks.

Parameters:
  Environment:
    Type: String
    Description: The environment that is used in the name of the cluster as well.
  OnyxNamespace:
    Type: String
    Default: onyx
  VpcID:
    Type: String
    Default: vpc-098cfa79d637dabff

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${Environment}-onyx-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      ClusterSettings:
        - Name: containerInsights
          Value: enhanced
      ServiceConnectDefaults:
        Namespace: !Sub ${Environment}-onyx-cluster
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: app
          Value: onyx

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Environment}-onyx-ecs-fargate-configs
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # User uploads / FILE_STORE_BACKEND=s3 (see S3_FILE_STORE_BUCKET_NAME). Account suffix avoids global S3 name clashes.
  S3FileStoreBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${Environment}-onyx-file-store-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PrivateDnsNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Description: AWS Cloud Map private DNS namespace for resources for onyx website.
      Vpc: !Ref VpcID
      Name: !Ref OnyxNamespace
      # Nested object for Cloud Map DNS settings uses the key "Properties" (AWS docs).
      Properties:
        DnsProperties:
          SOA:
            TTL: 50

  # Managed here so deploys are traceable; ECS reads JSON keys via ValueFrom ... :key::
  PostgresUserPasswordSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${Environment}/postgres/user/password
      Description: !Sub PostgreSQL password for Onyx (${Environment})
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\ "

  OnyxUserAuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${Environment}/onyx/user-auth-secret
      Description: !Sub Onyx USER_AUTH_SECRET (${Environment})
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: secret
        PasswordLength: 48
        ExcludeCharacters: "\"@/\\ "

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-OnyxEcsTaskRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "EFSPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "VisualEditor0"
                Effect: Allow
                Action:
                  - "elasticfilesystem:*"
                Resource:
                  - !Sub "arn:aws:elasticfilesystem:*:${AWS::AccountId}:access-point/*"
                  - !Sub "arn:aws:elasticfilesystem:*:${AWS::AccountId}:file-system/*"
              - Sid: "VisualEditor1"
                Effect: Allow
                Action: "elasticfilesystem:*"
                Resource: "*"
        - PolicyName: "S3Policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConfigBucketRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${Environment}-onyx-ecs-fargate-configs/*
                  - !Sub arn:aws:s3:::${Environment}-onyx-ecs-fargate-configs
              - Sid: FileStoreBucketReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:AbortMultipartUpload
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                Resource:
                  - !GetAtt S3FileStoreBucket.Arn
                  - !Sub "${S3FileStoreBucket.Arn}/*"

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-OnyxECSTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: "CloudWatchLogsPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "VisualEditor0"
                Effect: Allow
                Action: "logs:CreateLogGroup"
                Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:*"
        - PolicyName: "SecretsManagerPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref PostgresUserPasswordSecret
                  - !Ref OnyxUserAuthSecret

Outputs:
  OutputEcsCluster:
    Description: Onyx ECS Cluster
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${AWS::StackName}-ECSClusterName
  OutputECSTaskRole:
    Description: Onyx ECS Task Role (IAM ARN for task definitions and EFS IAM authorization)
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ECSTaskRole
  OutputECSTaskExecutionRole:
    Description: Onyx ECS TaskExecutionRole (IAM ARN for task definitions)
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ECSTaskExecutionRole
  OutputOnyxNamespace:
    Description: Onyx CloudMap namespace ID for ECS service discvoery.
    Value: !Ref PrivateDnsNamespace
    Export:
      Name: !Sub ${AWS::StackName}-OnyxNamespace
  OutputOnyxNamespaceName:
    Description: Onyx CloudMap namespace domain name for ECS service discvoery.
    Value: !Ref OnyxNamespace
    Export:
      Name: !Sub ${AWS::StackName}-OnyxNamespaceName
  OutputPostgresPasswordEcsValueFrom:
    Description: ECS container secret ValueFrom for POSTGRES_PASSWORD (Secrets Manager JSON key password)
    Value: !Sub "${PostgresUserPasswordSecret}:password::"
    Export:
      Name: !Sub ${AWS::StackName}-PostgresPasswordEcsValueFrom
  OutputOnyxUserAuthSecretEcsValueFrom:
    Description: ECS container secret ValueFrom for USER_AUTH_SECRET (Secrets Manager JSON key secret)
    Value: !Sub "${OnyxUserAuthSecret}:secret::"
    Export:
      Name: !Sub ${AWS::StackName}-OnyxUserAuthSecretEcsValueFrom
  OutputOnyxFileStoreBucketName:
    Description: S3 bucket name for Onyx file store (set S3_FILE_STORE_BUCKET_NAME on API / workers).
    Value: !Ref S3FileStoreBucket
    Export:
      Name: !Sub ${AWS::StackName}-OnyxFileStoreBucketName
